<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather APP</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="theme-initial">
  <!-- Animated sky layer -->
  <div id="sky">
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="stars"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="rain"></div>
    <div class="wind"></div>
    <div class="snow"></div>
  </div>

  <main class="app">
    <h1>Weather APP</h1>

    <form id="weatherForm" class="panel">
      <div class="controls">
        <label>
          <span>Select country</span>
          <select id="countrySelect" required>
            <option value="">-- choose --</option>
          </select>
        </label>

        <label>
          <span>Select city</span>
          <select id="citySelect" required disabled>
            <option value="">-- choose --</option>
          </select>
        </label>

        <button type="submit" class="btn">Get Info</button>
      </div>
    <div class="fx-row">
      <label class="sound-toggle">
        <input type="checkbox" id="soundToggle" />
        <span>🔊 Sound effects</span>
      </label>
    </div>

    </form>

    <section id="result" class="result hidden">
      <div class="info">
        <img id="wxIcon" alt="" />
        <div>
          <h2 id="wxTitle"></h2>
          <p id="wxMeta"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
